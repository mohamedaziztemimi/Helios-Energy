<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLARIS / Plant Analyst</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0d1015;
    color: #e6e9ee;
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; }
  textarea { font-family: inherit; }
  input { font-family: inherit; }

  @keyframes msgIn   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes lineIn  { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  @keyframes dotPulse{ 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes blink   { 50% { opacity: 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .pickbtn:hover { border-color: #f5a62366 !important; background: #171c25 !important; }
  .switch-btn:hover { border-color: #3a434f !important; color: #e6e9ee !important; }
  .sug-btn:hover { border-color: #f5a62355 !important; background: #171c25 !important; }
  .trace-toggle:hover { color: #e6e9ee !important; border-color: #3a434f !important; background: #171c25 !important; }
  .file-card:hover { background: #131822 !important; border-color: #3a434f !important; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
(function () {
  // ----- API base -----
  // Served from FastAPI on the same origin in production (relative URL).
  // For local file:// testing, point at the local dev server.
  const API_BASE_URL = (location.protocol === 'file:')
    ? 'http://127.0.0.1:8000'
    : '';

  // ----- sessionStorage helpers -----
  const SS_KEY_KEY = 'invertix.accessKey';
  const SS_USER_KEY = 'invertix.userId';
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function fmtT(ms) {
    const d = new Date(ms);
    const p = (n, l) => String(n).padStart(l || 2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3);
  }

  const companyNames = {
    company_1: 'Helios Renewables',
    company_2: 'Aurora Grid Energy',
  };

  const app = {
    users: [],
    state: null,
    _timers: [],
    _msgSeq: 0,
    _scroll: null,
    _scrollNext: false,
    _start: 0,
    _tick: null,
    _toast: null,
    _es: null,
    _runId: null,
    _finalizedRunId: null,
    _activeBubbleId: null,
    _restorePending: null,

    init: function () {
      const savedKey = ssGet(SS_KEY_KEY);
      const savedUser = ssGet(SS_USER_KEY);
      let start = 'gate';
      if (savedKey && savedUser) start = 'restoring';
      this.state = {
        view: start, user: null,
        messages: [], running: false, trace: [], input: '', toast: '',
        sessionId: null, usersLoading: false, usersError: '',
        accessKey: '', gateInput: '', gateError: '', gateBusy: false,
      };
      this._restorePending = (start === 'restoring') ? { key: savedKey, userId: savedUser } : null;
    },

    setState: function (patch) {
      if (typeof patch === 'function') patch = patch(this.state);
      Object.assign(this.state, patch);
      this.render();
    },
    forceUpdate: function () { this.render(); },

    didMount: function () {
      if (this._restorePending) {
        this._restoreFromSession(this._restorePending);
        this._restorePending = null;
        return;
      }
      if (this.state.view !== 'gate') this.fetchUsers('');
    },

    _restoreFromSession: function (info) {
      const self = this;
      const key = info.key, userId = info.userId;
      fetch(API_BASE_URL + '/api/users', { headers: { 'X-Demo-Key': key } })
        .then(function (r) {
          if (r.status === 403) {
            ssDel(SS_KEY_KEY); ssDel(SS_USER_KEY);
            self.setState({ view: 'gate', accessKey: '', gateError: '' });
            return null;
          }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (raw) {
          if (raw === null) return;
          self.users = (raw || []).map(function (u) { return self.mapApiUser(u); });
          const saved = self.users.find(function (u) { return u.id === userId; });
          if (!saved) {
            ssDel(SS_USER_KEY);
            self.setState({ accessKey: key, view: 'login' });
            return;
          }
          self.setState({
            accessKey: key, view: 'app', user: saved,
            messages: [], running: false, trace: [], input: '', sessionId: null,
          });
          self.loadHistory(saved.id);
        })
        .catch(function (err) {
          ssDel(SS_KEY_KEY); ssDel(SS_USER_KEY);
          self.setState({
            view: 'gate', accessKey: '',
            gateError: 'Session restore failed — ' + (err.message || err),
          });
        });
    },

    apiHeaders: function (userId, extra) {
      const h = Object.assign({}, extra || {});
      if (this.state.accessKey) h['X-Demo-Key'] = this.state.accessKey;
      if (userId) h['Authorization'] = 'Bearer ' + userId;
      return h;
    },

    fetchUsers: function (keyOverride) {
      const self = this;
      const keyForHeader = keyOverride || this.state.accessKey;
      const headers = {};
      if (keyForHeader) headers['X-Demo-Key'] = keyForHeader;
      this.setState({ usersLoading: true });
      return fetch(API_BASE_URL + '/api/users', { headers: headers })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (raw) {
          self.users = (raw || []).map(function (u) { return self.mapApiUser(u); });
          self.setState({ usersLoading: false, usersError: '' });
        })
        .catch(function (err) {
          self.users = [];
          const msg = 'Could not load users from ' + (API_BASE_URL || '(this origin)') + ' — ' + (err.message || err);
          self.setState({ usersLoading: false, usersError: msg, toast: msg });
          clearTimeout(self._toast);
          self._toast = setTimeout(function () { self.setState({ toast: '' }); }, 5000);
        });
    },

    unlock: function () {
      const self = this;
      const key = (this.state.gateInput || '').trim();
      if (!key) { this.setState({ gateError: 'Please enter an access key.' }); return; }
      if (this.state.gateBusy) return;
      this.setState({ gateBusy: true, gateError: '' });
      fetch(API_BASE_URL + '/api/users', { headers: { 'X-Demo-Key': key } })
        .then(function (r) {
          if (r.status === 403) {
            self.setState({ gateBusy: false, gateError: 'Incorrect access key.' });
            return null;
          }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (raw) {
          if (raw === null) return;
          self.users = (raw || []).map(function (u) { return self.mapApiUser(u); });
          ssSet(SS_KEY_KEY, key);
          self.setState({
            accessKey: key, view: 'login',
            gateBusy: false, gateError: '', gateInput: '',
            usersLoading: false, usersError: '',
          });
        })
        .catch(function (err) {
          self.setState({ gateBusy: false, gateError: 'Could not validate access key — ' + (err.message || err) });
        });
    },

    mapApiUser: function (u) {
      const local = (u.email || '').split('@')[0] || u.id || '';
      const parts = local.split(/[._-]+/).filter(Boolean);
      const name = parts.length
        ? parts.map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ')
        : (u.id || '');
      const initials = parts.length >= 2
        ? (parts[0][0] + parts[1][0]).toUpperCase()
        : (parts[0] || u.id || '??').slice(0, 2).toUpperCase();
      const companyName = companyNames[u.company_id] || u.company_id;
      return {
        id: u.id, name: name, initials: initials, email: u.email || '',
        company: u.company_id, companyName: companyName,
        role: u.role || '', access: u.access_scope || '',
      };
    },

    clearTimers: function () {
      (this._timers || []).forEach(clearTimeout);
      this._timers = [];
      clearInterval(this._tick);
      try { if (this._es) { this._es.close(); this._es = null; } } catch (e) {}
    },

    mkId: function () { this._msgSeq += 1; return 'm' + this._msgSeq; },

    pick: function (u) {
      this.clearTimers();
      this._scrollNext = true;
      ssSet(SS_USER_KEY, u.id);
      this.setState({ view: 'app', user: u, messages: [], running: false, trace: [], input: '', sessionId: null });
      this.loadHistory(u.id);
    },
    switchUser: function () {
      this.clearTimers();
      ssDel(SS_USER_KEY);
      this.setState({ view: 'login', user: null, messages: [], running: false, trace: [], input: '', sessionId: null });
    },
    toggleTrace: function (id) {
      this.setState(function (st) {
        return {
          messages: st.messages.map(function (m) {
            return m._id === id ? Object.assign({}, m, { traceOpen: !m.traceOpen }) : m;
          }),
        };
      });
    },

    classifyLine: function (raw) {
      if (/generate_pdf|generate_word|generate_docx|generate_excel|generate_xlsx/i.test(raw)) return 'artifact';
      if (/run_python|python_repl|exec_python/i.test(raw)) return 'code';
      if (/error|exception|traceback|fail|denied|blocked/i.test(raw)) return 'deny';
      if (/^\s*\[tools?\b/i.test(raw)) return 'tool';
      if (/^\s*\[agent\b/i.test(raw)) return 'info';
      if (/^\s*SELECT\b|^\s*INSERT\b|^\s*UPDATE\b|^\s*DELETE\b|^\s*WITH\b/i.test(raw)) return 'query';
      if (/complete|done|ok\b/i.test(raw)) return 'result';
      return 'info';
    },

    pushOutputLines: function (newText) {
      const self = this;
      const lines = newText.split(/\r?\n/).filter(function (l) { return l.length > 0; });
      if (lines.length === 0) return;
      const ts = fmtT(Date.now());
      const steps = lines.map(function (l) { return { kind: self.classifyLine(l), text: l, indent: 0, t: ts }; });
      this._scrollNext = true;
      this.setState(function (st) { return { trace: st.trace.concat(steps) }; });
    },

    mapLine: function (l) {
      const M = ({
        info:     { c: '#6b7480', t: '#aeb6c2' },
        tool:     { c: '#f5a623', t: '#f5c06b' },
        query:    { c: '#3a424d', t: '#6b7480' },
        result:   { c: '#5fd08a', t: '#86c7a4' },
        ok:       { c: '#5fd08a', t: '#86c7a4' },
        deny:     { c: '#f0716a', t: '#f0a09a' },
        warn:     { c: '#f5a623', t: '#f5c06b' },
        code:     { c: '#a78bfa', t: '#c4b1ff' },
        artifact: { c: '#ffb84d', t: '#ffd486' },
      })[l.kind] || { c: '#6b7480', t: '#aeb6c2' };
      const G = ({
        info: '▸', tool: '▸', query: '└─', result: '└─',
        ok: '✓', deny: '✕', warn: '!', code: '▶', artifact: '◆',
      })[l.kind] || '·';
      return { t: l.t || fmtT(Date.now()), glyph: G, color: M.c, textColor: M.t, text: l.text, pad: ((l.indent || 0) * 18) + 'px' };
    },

    send: function () {
      const self = this;
      const q = (this.state.input || '').trim();
      if (!q || this.state.running) return;
      if (!this.state.user) return;
      const userId = this.state.user.id;
      const sessionId = this.state.sessionId;
      this._scrollNext = true;
      this.setState(function (st) {
        return {
          messages: st.messages.concat([{ _id: self.mkId(), role: 'user', text: q }]),
          input: '', running: true, trace: [],
        };
      });
      this._start = Date.now();
      this._finalizedRunId = null;
      this._activeBubbleId = null;
      this.clearTimers();
      this._tick = setInterval(function () { self.forceUpdate(); }, 100);

      fetch(API_BASE_URL + '/api/chat', {
        method: 'POST',
        headers: this.apiHeaders(userId, { 'Content-Type': 'application/json' }),
        body: JSON.stringify({ message: q, session_id: sessionId || undefined }),
      })
        .then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 200)); });
          return r.json();
        })
        .then(function (data) {
          self.setState({ sessionId: data.session_id });
          self._runId = data.run_id;
          self.streamRun(data.run_id, userId);
        })
        .catch(function (err) { self.handleRunError(err); });
    },

    showOrUpdateBubble: function (finalText, output) {
      const self = this;
      const runId = this._runId || '';
      if (this._activeBubbleId) {
        const id = this._activeBubbleId;
        this.setState(function (st) {
          return {
            messages: st.messages.map(function (m) {
              return m._id === id ? Object.assign({}, m, { answer: finalText }) : m;
            }),
          };
        });
        return;
      }
      const id = this.mkId();
      this._activeBubbleId = id;
      this._scrollNext = true;
      const files = this.extractGeneratedFiles(output || '')
        .map(function (f) { return Object.assign({}, f, { runId: f.runId || runId }); });
      this.setState(function (st) {
        return {
          messages: st.messages.concat([{
            _id: id, role: 'agent',
            trace: st.trace.slice(),
            traceTime: '', traceOpen: false,
            answer: finalText, notice: '', metrics: [], report: null,
            files: files, pending: true,
          }]),
        };
      });
    },

    streamRun: function (runId, userId, initialOutputLen) {
      const self = this;
      let url = API_BASE_URL + '/api/runs/' + encodeURIComponent(runId)
        + '/stream?user_id=' + encodeURIComponent(userId);
      if (this.state.accessKey) url += '&demo_key=' + encodeURIComponent(this.state.accessKey);
      let es;
      try { es = new EventSource(url); }
      catch (e) { this.pollRun(runId, userId, initialOutputLen); return; }
      this._es = es;
      let lastLen = initialOutputLen || 0;
      let fellBack = false;
      es.onmessage = function (ev) {
        let data;
        try { data = JSON.parse(ev.data); } catch (e) { return; }
        if (data.error && !data.status) { try { es.close(); } catch (e) {} self.handleRunError(new Error(data.error)); return; }
        const output = data.output || '';
        if (output.length > lastLen) {
          self.pushOutputLines(output.slice(lastLen));
          lastLen = output.length;
        }
        const ft = (typeof data.final_text === 'string' && data.final_text.trim()) ? data.final_text.trim() : '';
        if (ft) self.showOrUpdateBubble(ft, output);
        if (data.status === 'completed' || data.status === 'failed') {
          try { es.close(); } catch (e) {}
          self.finishRun(data.status, output, data.error, data.final_text);
        }
      };
      es.onerror = function () {
        if (fellBack) return;
        fellBack = true;
        try { es.close(); } catch (e) {}
        self._es = null;
        self.pollRun(runId, userId, lastLen);
      };
    },

    pollRun: function (runId, userId, initialOutputLen) {
      const self = this;
      let lastLen = initialOutputLen || 0;
      const tick = function () {
        if (!self.state.running) return;
        fetch(API_BASE_URL + '/api/runs/' + encodeURIComponent(runId), {
          headers: self.apiHeaders(userId),
        })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            if (!self.state.running) return;
            if (data.error && !data.status) { self.handleRunError(new Error(data.error)); return; }
            const output = data.output || '';
            if (output.length > lastLen) {
              self.pushOutputLines(output.slice(lastLen));
              lastLen = output.length;
            }
            const ft = (typeof data.final_text === 'string' && data.final_text.trim()) ? data.final_text.trim() : '';
            if (ft) self.showOrUpdateBubble(ft, output);
            if (data.status === 'completed' || data.status === 'failed') {
              self.finishRun(data.status, output, data.error, data.final_text);
            } else {
              const t = setTimeout(tick, 1500);
              self._timers.push(t);
            }
          })
          .catch(function (err) { self.handleRunError(err); });
      };
      tick();
    },

    extractGeneratedFiles: function (output) {
      if (!output) return [];
      const palette = {
        pdf:   { label: 'PDF',   color: '#f0716a', bgColor: '#f0716a1a', borderColor: '#f0716a40' },
        word:  { label: 'WORD',  color: '#5b8def', bgColor: '#5b8def1a', borderColor: '#5b8def40' },
        excel: { label: 'EXCEL', color: '#5fd08a', bgColor: '#5fd08a1a', borderColor: '#5fd08a40' },
      };
      const files = [];
      const seen = new Set();
      const lines = output.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        let type = /generate_pdf/i.test(line) ? 'pdf'
                : /generate_word|generate_docx/i.test(line) ? 'word'
                : /generate_excel|generate_xlsx/i.test(line) ? 'excel' : null;
        if (!type) continue;
        const extPat = type === 'pdf' ? 'pdf' : (type === 'word' ? 'docx?' : 'xlsx?');
        const rx = new RegExp("[A-Za-z0-9_./\\\\:\\- ]+\\.(?:" + extPat + ")\\b", 'i');
        const m = line.match(rx);
        let path = m ? m[0].trim() : '';
        if (!path) {
          const fm = line.match(/['"]filename['"]\s*:\s*['"]([^'"]+)['"]/i);
          if (fm) path = fm[1];
        }
        if (!path) continue;
        const displayPath = path.replace(/\\\\/g, '/').replace(/\\/g, '/');
        const key = type + ':' + displayPath;
        if (seen.has(key)) continue;
        seen.add(key);
        const segs = displayPath.split('/').filter(Boolean);
        const name = segs[segs.length - 1] || displayPath;
        const runId = segs.length >= 2 ? segs[segs.length - 2] : '';
        files.push(Object.assign({ type: type, path: displayPath, name: name, runId: runId }, palette[type]));
      }
      return files;
    },

    downloadFile: function (file) {
      const self = this;
      if (!file || !file.name) return;
      const userId = this.state.user && this.state.user.id;
      if (!userId) return;
      const runId = file.runId || this._runId;
      if (!runId) { this.setState({ toast: 'Cannot download — run id missing.' }); return; }
      const url = API_BASE_URL + '/api/runs/' + encodeURIComponent(runId)
        + '/files/' + encodeURIComponent(file.name);
      this.setState({ toast: 'Downloading ' + file.name + '…' });
      fetch(url, { headers: this.apiHeaders(userId) })
        .then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 160)); });
          return r.blob();
        })
        .then(function (blob) {
          const bUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = bUrl; a.download = file.name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(bUrl); }, 4000);
          self.setState({ toast: 'Downloaded ' + file.name });
          clearTimeout(self._toast);
          self._toast = setTimeout(function () { self.setState({ toast: '' }); }, 2800);
        })
        .catch(function (err) {
          self.setState({ toast: 'Download failed — ' + (err.message || err) });
          clearTimeout(self._toast);
          self._toast = setTimeout(function () { self.setState({ toast: '' }); }, 4500);
        });
    },

    finishRun: function (status, output, error, finalText) {
      const self = this;
      if (this._finalizedRunId && this._finalizedRunId === this._runId) return;
      this._finalizedRunId = this._runId;
      clearInterval(this._tick);
      const traceTime = ((Date.now() - this._start) / 1000).toFixed(1) + 's';
      const rawFiles = this.extractGeneratedFiles(output || '');
      const runId = this._runId || '';
      const files = rawFiles.map(function (f) { return Object.assign({}, f, { runId: f.runId || runId }); });
      const cleanFinal = (typeof finalText === 'string' && finalText.trim()) ? finalText.trim() : '';
      let answer;
      if (status === 'failed') {
        answer = cleanFinal || ('Agent run failed: ' + (error || 'unknown error'));
      } else if (cleanFinal) {
        answer = cleanFinal;
      } else if (files.length) {
        answer = 'Run completed in ' + traceTime + '. ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' generated (shown below).';
      } else {
        answer = 'Run completed in ' + traceTime + '. Expand the trace below to see the agent’s reasoning and tool calls.';
      }
      const activeId = this._activeBubbleId;
      this._activeBubbleId = null;
      this._scrollNext = true;
      this.setState(function (st) {
        if (activeId) {
          return {
            messages: st.messages.map(function (m) {
              return m._id === activeId ? Object.assign({}, m, {
                answer: answer, trace: st.trace, traceTime: traceTime, files: files, pending: false,
              }) : m;
            }),
            running: false, trace: [],
          };
        }
        return {
          messages: st.messages.concat([{
            _id: self.mkId(), role: 'agent',
            trace: st.trace, traceTime: traceTime, traceOpen: false,
            answer: answer, notice: '', metrics: [], report: null,
            files: files, pending: false,
          }]),
          running: false, trace: [],
        };
      });
    },

    handleRunError: function (err) {
      const self = this;
      if (this._finalizedRunId && this._finalizedRunId === this._runId) return;
      this._finalizedRunId = this._runId;
      clearInterval(this._tick);
      try { if (this._es) { this._es.close(); this._es = null; } } catch (e) {}
      const traceTime = ((Date.now() - this._start) / 1000).toFixed(1) + 's';
      const errMsg = 'Request failed: ' + (err && err.message ? err.message : String(err));
      const activeId = this._activeBubbleId;
      this._activeBubbleId = null;
      this._scrollNext = true;
      this.setState(function (st) {
        if (activeId) {
          return {
            messages: st.messages.map(function (m) {
              return m._id === activeId ? Object.assign({}, m, {
                answer: errMsg, trace: st.trace, traceTime: traceTime, pending: false,
              }) : m;
            }),
            running: false, trace: [],
          };
        }
        return {
          messages: st.messages.concat([{
            _id: self.mkId(), role: 'agent',
            trace: st.trace, traceTime: traceTime, traceOpen: false,
            answer: errMsg, notice: '', metrics: [], report: null, files: [],
            pending: false,
          }]),
          running: false, trace: [],
        };
      });

    loadHistory: function (userId) {
      const self = this;
      fetch(API_BASE_URL + '/api/runs', { headers: this.apiHeaders(userId) })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (runs) {
          if (!Array.isArray(runs) || runs.length === 0) return;
          const ordered = runs.slice().reverse();
          const newest = runs[0] || null;
          const newestIsLive = newest
            && newest.status === 'running'
            && !(typeof newest.final_text === 'string' && newest.final_text.trim());

          const messages = [];
          for (let i = 0; i < ordered.length; i++) {
            const run = ordered[i];
            if (!run) continue;
            if (newestIsLive && run.id === newest.id) continue;
            if (run.input) messages.push({ _id: self.mkId(), role: 'user', text: run.input });
            messages.push(self.messageFromHistory(run));
          }
          const latestForSession = ordered[ordered.length - 1];
          const newState = {
            messages: messages,
            sessionId: latestForSession && latestForSession.session_id ? latestForSession.session_id : null,
          };
          if (newestIsLive) {
            if (newest.input) messages.push({ _id: self.mkId(), role: 'user', text: newest.input });
            const initialOutput = newest.output || '';
            newState.messages = messages;
            newState.running = true;
            newState.trace = self.traceFromOutput(initialOutput);
            self._runId = newest.id;
            self._start = newest.created_at ? Date.parse(newest.created_at) : Date.now();
            self._finalizedRunId = null;
            self._activeBubbleId = null;
            const histFt = (typeof newest.final_text === 'string' && newest.final_text.trim()) ? newest.final_text.trim() : '';
            if (histFt) {
              const id = self.mkId();
              self._activeBubbleId = id;
              const runId = newest.id;
              const histFiles = self.extractGeneratedFiles(initialOutput)
                .map(function (f) { return Object.assign({}, f, { runId: f.runId || runId }); });
              messages.push({
                _id: id, role: 'agent',
                trace: newState.trace.slice(),
                traceTime: '', traceOpen: false,
                answer: histFt, notice: '', metrics: [], report: null,
                files: histFiles, pending: true,
              });
            }
          }
          self._scrollNext = true;
          self.setState(newState);
          if (newestIsLive) {
            self._tick = setInterval(function () { self.forceUpdate(); }, 100);
            self.streamRun(newest.id, userId, (newest.output || '').length);
          }
        })
        .catch(function (err) {
          self.setState({ toast: 'Could not load history — ' + (err.message || err) });
          clearTimeout(self._toast);
          self._toast = setTimeout(function () { self.setState({ toast: '' }); }, 4000);
        });
    },

    traceFromOutput: function (output) {
      const self = this;
      const ts = fmtT(Date.now());
      return (output || '').split(/\r?\n/).filter(function (l) { return l.length > 0; })
        .map(function (l) { return { kind: self.classifyLine(l), text: l, indent: 0, t: ts }; });
    },

    messageFromHistory: function (run) {
      const self = this;
      const output = run.output || '';
      const ts = run.created_at ? fmtT(Date.parse(run.created_at)) : fmtT(Date.now());
      const lines = output.split(/\r?\n/).filter(function (l) { return l.length > 0; });
      const trace = lines.map(function (l) { return { kind: self.classifyLine(l), text: l, indent: 0, t: ts }; });
      const rawFiles = this.extractGeneratedFiles(output);
      const files = rawFiles.map(function (f) { return Object.assign({}, f, { runId: f.runId || run.id }); });
      let traceTime = '';
      if (run.created_at && run.updated_at) {
        const ms = Date.parse(run.updated_at) - Date.parse(run.created_at);
        if (ms > 0) traceTime = (ms / 1000).toFixed(1) + 's';
      }
      const cleanFinal = (typeof run.final_text === 'string' && run.final_text.trim()) ? run.final_text.trim() : '';
      let answer;
      if (cleanFinal) {
        answer = cleanFinal;
      } else if (run.status === 'failed') {
        answer = 'Agent run failed.';
      } else if (run.status === 'running') {
        answer = 'Run still in progress…';
      } else {
        answer = files.length
          ? files.length + ' file' + (files.length > 1 ? 's' : '') + ' generated (shown below). Expand the trace to see the agent’s tool calls.'
          : 'Run completed' + (traceTime ? ' in ' + traceTime : '') + '. Expand the agent trace below to see the full reasoning and tool calls.';
      }
      return {
        _id: this.mkId(),
        role: 'agent', trace: trace, traceTime: traceTime, traceOpen: false,
        answer: answer, notice: '', metrics: [], report: null, files: files,
      };
    },

    renderVals: function () {
      const self = this;
      const accClr = function (a) {
        return a === 'energy+financial'
          ? { color: '#f5a623', bg: '#f5a6231a', border: '#f5a62340' }
          : { color: '#8fb8a0', bg: '#5fd08a14', border: '#5fd08a33' };
      };
      const accLabel = function (a) {
        return a === 'energy+financial' ? 'energy + financial' : (a || 'energy');
      };

      const cids = [];
      (this.users || []).forEach(function (u) { if (cids.indexOf(u.company) === -1) cids.push(u.company); });
      const companyGroups = cids.map(function (cid) {
        return {
          name: companyNames[cid] || cid,
          users: self.users.filter(function (u) { return u.company === cid; }).map(function (u) {
            const c = accClr(u.access);
            return Object.assign({}, u, {
              roleLabel: (u.role || '').toUpperCase(),
              accessLabel: accLabel(u.access),
              accessColor: c.color, accessBg: c.bg, accessBorder: c.border,
            });
          }),
        };
      });

      const u = this.state.user || {};
      const uc = accClr(u.access);

      const sugTexts = [
        'How many plants do I have and what is their total nominal capacity?',
        'Generate a PDF report summarizing my plants’ energy production this month.',
        'Which of my plants produced the most energy in the last 7 days?',
        'Use Python to compute the daily generation breakdown across all my plants.',
      ];

      const msgs = this.state.messages.map(function (m) {
        if (m.role === 'user') return { isUser: true, isAgent: false, text: m.text };
        return {
          isUser: false, isAgent: true, answer: m.answer,
          hasNotice: !!m.notice, notice: m.notice || '',
          hasFiles: (m.files || []).length > 0,
          files: m.files || [],
          trace: (m.trace || []).map(function (l) { return self.mapLine(l); }),
          traceCount: (m.trace || []).length,
          traceTime: m.traceTime || '', traceOpen: !!m.traceOpen,
          caret: m.traceOpen ? ' ▾' : ' ▸',
          toggleLabel: m.traceOpen ? 'hide trace' : 'show trace',
          _mid: m._id,
        };
      });

      const canSend = !this.state.running && (this.state.input || '').trim().length > 0 && !!this.state.user;
      const gateCanSubmit = !this.state.gateBusy && (this.state.gateInput || '').trim().length > 0;
      const isGateLike = this.state.view === 'gate' || this.state.view === 'restoring';

      return {
        isGate: isGateLike,
        gateInput: this.state.gateInput,
        gateError: this.state.gateError,
        hasGateError: !!this.state.gateError,
        gateBusy: this.state.gateBusy,
        gateDisabled: !gateCanSubmit,

        gateBg: gateCanSubmit ? '#f5a623' : '#2a323c',
        gateOpacity: gateCanSubmit ? '1' : '0.55',
        gateCursor: gateCanSubmit ? 'pointer' : 'not-allowed',
        isLogin: this.state.view === 'login',
        isApp: this.state.view === 'app',
        companyGroups: companyGroups,
        companyName: u.companyName || '', userEmail: u.email || '', userInitials: u.initials || '',
        userRole: (u.role || '').toUpperCase(), userAccessLabel: accLabel(u.access),
        userAccessColor: uc.color, userAccessBg: uc.bg, userAccessBorder: uc.border,
        showEmpty: this.state.messages.length === 0 && !this.state.running,
        msgs: msgs,
        running: this.state.running,
        liveTrace: this.state.trace.map(function (l) { return self.mapLine(l); }),
        liveElapsed: (this.state.running && this._start) ? ((Date.now() - this._start) / 1000).toFixed(1) + 's' : '0.0s',
        suggestions: sugTexts,
        input: this.state.input,
        sendDisabled: !canSend,
        sendBg: canSend ? '#f5a623' : '#2a323c',
        sendOpacity: canSend ? '1' : '0.55',
        sendCursor: canSend ? 'pointer' : 'not-allowed',
        hasToast: !!this.state.toast, toast: this.state.toast,
      };
    },

    render: function () {
      const v = this.renderVals();
      const root = document.getElementById('root');

      const active = document.activeElement;
      const activeId = active && active.id;
      const selStart = active && (active.selectionStart != null) ? active.selectionStart : null;
      const selEnd = active && (active.selectionEnd != null) ? active.selectionEnd : null;

      let html;
      if (v.isGate) html = this.renderGate(v);
      else if (v.isLogin) html = this.renderLogin(v);
      else if (v.isApp) html = this.renderApp(v);
      else html = '';
      if (v.hasToast) html += this.renderToast(v);

      root.innerHTML = html;
      this.bindEvents(v);

      this._scroll = document.getElementById('chatScroll');
      if (this._scrollNext) {
        this._scrollNext = false;
        if (this._scroll) this._scroll.scrollTop = this._scroll.scrollHeight;
      }

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          try {
            el.focus();
            if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd);
          } catch (e) {}
        }
      } else if (v.isGate) {
        const gi = document.getElementById('gateInput');
        if (gi) gi.focus();
      }
    },

              +   '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;color:#6b7480;margin-top:3px;word-break:break-all;">' + esc(f.path) + '</div>'
              + '</div>'
              + '<span style="display:flex;align-items:center;gap:6px;font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.06em;color:' + f.color + ';text-transform:uppercase;flex:none;"><span style="font-size:13px;line-height:1;">↓</span>download</span>'
              + '</div>';
          }).join('');
          files = '<div style="margin-top:16px;display:flex;flex-direction:column;gap:9px;max-width:620px;">'
            + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.12em;color:#8b94a3;text-transform:uppercase;">Generated artifacts</div>'
            + cards
            + '</div>';
        }
        return '<div style="animation:msgIn .25s ease-out;">'
          + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;">'
          +   '<span style="width:7px;height:7px;border-radius:50%;background:#f5a623;display:block;"></span>'
          +   '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.16em;color:#8b94a3;text-transform:uppercase;">Analyst Agent</span>'
          + '</div>'
          + '<button class="trace-toggle" data-toggle="' + esc(m._mid) + '" type="button" style="display:inline-flex;align-items:center;gap:9px;background:#14181f;border:1px solid #232a33;border-radius:8px;color:#8b94a3;font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.07em;cursor:pointer;padding:8px 14px;margin-bottom:11px;text-transform:uppercase;">'
          +   '<span style="color:#5fd08a;">✓</span><span>' + esc(m.caret) + ' ' + esc(m.toggleLabel) + ' · ' + m.traceCount + ' steps · ' + esc(m.traceTime) + '</span>'
          + '</button>'
          + tracePanel
          + '<div style="font-size:15px;line-height:1.68;color:#cfd5de;max-width:660px;white-space:pre-wrap;">' + esc(m.answer) + '</div>'
          + notice
          + files
          + '</div>';
      }).join('');

      let liveTrace = '';
      if (v.running) {
        const liveLines = v.liveTrace.map(function (l) {
          return '<div style="display:flex;gap:11px;padding-left:' + l.pad + ';animation:lineIn .18s ease-out;">'
            + '<span style="color:#3a424d;flex:none;">' + esc(l.t) + '</span>'
            + '<span style="color:' + l.color + ';flex:none;width:14px;">' + esc(l.glyph) + '</span>'
            + '<span style="color:' + l.textColor + ';white-space:pre-wrap;word-break:break-word;">' + esc(l.text) + '</span>'
            + '</div>';
        }).join('');
        liveTrace = ''
          + '<div style="animation:msgIn .25s ease-out;">'
          +   '<div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;">'
          +     '<span style="width:7px;height:7px;border-radius:50%;background:#f5a623;display:block;"></span>'
          +     '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.16em;color:#8b94a3;text-transform:uppercase;">Analyst Agent</span>'
          +   '</div>'
          +   '<div style="background:#0a0c10;border:1px solid #f5a62340;border-radius:11px;font-family:\'IBM Plex Mono\',monospace;overflow:hidden;box-shadow:0 0 0 1px #f5a6230d,0 14px 40px -18px #000;">'
          +     '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #1d242d;background:#0c0f15;">'
          +       '<div style="display:flex;align-items:center;gap:9px;">'
          +         '<span style="width:7px;height:7px;border-radius:50%;background:#f5a623;animation:dotPulse 1.3s infinite;"></span>'
          +         '<span style="font-size:10.5px;letter-spacing:.16em;color:#aeb6c2;text-transform:uppercase;">Agent Trace</span>'
          +         '<span style="font-size:10.5px;letter-spacing:.1em;color:#f5a623;text-transform:uppercase;">· running</span>'
          +       '</div>'
          +       '<span style="font-size:11px;color:#5a6371;">' + esc(v.liveElapsed) + '</span>'
          +     '</div>'
          +     '<div style="padding:12px 14px;font-size:12px;line-height:1.65;overflow-x:auto;">'
          +       liveLines
          +       '<div style="margin-top:5px;"><span style="display:inline-block;width:8px;height:14px;background:#f5a623;vertical-align:middle;animation:blink 1s step-end infinite;"></span></div>'
          +     '</div>'
          +   '</div>'
          + '</div>';
      }

      const input = ''
        + '<div style="border-top:1px solid #1b212a;background:#0c0f14;padding:16px 30px 14px;flex:none;">'
        +   '<div style="max-width:840px;margin:0 auto;">'
        +     '<div style="display:flex;align-items:flex-end;gap:10px;background:#14181f;border:1px solid #232a33;border-radius:13px;padding:7px 7px 7px 16px;">'
        +       '<textarea id="chatInput" rows="1" placeholder="Ask about production, performance, costs, or request a report…" style="flex:1;background:none;border:none;outline:none;color:#e6e9ee;font-size:14.5px;line-height:1.5;resize:none;padding:9px 0;max-height:120px;">' + esc(v.input) + '</textarea>'
        +       '<button id="sendBtn" ' + (v.sendDisabled ? 'disabled' : '') + ' style="display:flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:10px 16px;cursor:' + v.sendCursor + ';color:#1a1205;font-weight:600;font-size:13px;background:' + v.sendBg + ';opacity:' + v.sendOpacity + ';flex:none;">Send →</button>'
        +     '</div>'
        +     '<div style="display:flex;justify-content:space-between;margin-top:9px;font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#4a525e;">'
        +       '<span>enter to send · shift+enter for newline</span>'
        +       '<span>scope: ' + esc(v.userAccessLabel) + '</span>'
        +     '</div>'
        +   '</div>'
        + '</div>';

      return ''
        + '<div style="height:100vh;display:flex;flex-direction:column;">'
        +   header
        +   '<div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0;">'
        +     '<div style="display:flex;flex-direction:column;min-height:0;min-width:0;">'
        +       '<div id="chatScroll" style="flex:1;overflow:auto;">'
        +         '<div style="max-width:840px;margin:0 auto;padding:30px 30px 18px;display:flex;flex-direction:column;gap:24px;">'
        +           empty + msgs + liveTrace
        +         '</div>'
        +       '</div>'
        +       input
        +     '</div>'
        +   '</div>'
        + '</div>';
    },

    renderToast: function (v) {
      return '<div style="position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#171c25;border:1px solid #2e3742;border-radius:9px;padding:11px 17px;display:flex;align-items:center;gap:9px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:#cfd5de;box-shadow:0 14px 40px -16px #000;animation:toastIn .25s ease-out;z-index:50;">'
        + '<span style="color:#5fd08a;">↓</span>' + esc(v.toast)
        + '</div>';
    },

    bindEvents: function (v) {
      const self = this;

      const gateInput = document.getElementById('gateInput');
      if (gateInput) {
        gateInput.oninput = function (e) { self.setState({ gateInput: e.target.value, gateError: '' }); };
        gateInput.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); self.unlock(); } };
      }
      const gateBtn = document.getElementById('gateBtn');
      if (gateBtn) gateBtn.onclick = function () { self.unlock(); };

      const picks = document.querySelectorAll('[data-pick]');
      picks.forEach(function (btn) {
        btn.onclick = function () {
          const id = btn.getAttribute('data-pick');
          const u = self.users.find(function (x) { return x.id === id; });
          if (u) self.pick(u);
        };
      });

      const sw = document.getElementById('switchBtn');
      if (sw) sw.onclick = function () { self.switchUser(); };

      const sugs = document.querySelectorAll('[data-sug]');
      sugs.forEach(function (btn) {
        btn.onclick = function () {
          const i = +btn.getAttribute('data-sug');
          const text = v.suggestions[i];
          self.setState({ input: text });
          setTimeout(function () { self.send(); }, 0);
        };
      });

      const togs = document.querySelectorAll('[data-toggle]');
      togs.forEach(function (btn) {
        btn.onclick = function () { self.toggleTrace(btn.getAttribute('data-toggle')); };
      });

      const cards = document.querySelectorAll('.file-card');
      cards.forEach(function (card) {
        card.onclick = function () {
          const mid = card.getAttribute('data-mid');
          const fi = +card.getAttribute('data-fi');
          const m = self.state.messages.find(function (x) { return x._id === mid; });
          if (m && m.files && m.files[fi]) self.downloadFile(m.files[fi]);
        };
        card.onkeydown = function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        };
      });

      const ci = document.getElementById('chatInput');
      if (ci) {
        ci.oninput = function (e) { self.setState({ input: e.target.value }); };
        ci.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); self.send(); } };
      }
      const sendBtn = document.getElementById('sendBtn');
      if (sendBtn) sendBtn.onclick = function () { self.send(); };
    },
  };

  app.init();
  app.render();
  app.didMount();

  window.__app = app;
})();
</script>
</body>
</html>
